<!DOCTYPE html>
<html>
<head>
    <title>Test Registration API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5">
        <h2>Test Registration API</h2>
        
        <div class="card">
            <div class="card-body">
                <h5>API Connection Test</h5>
                <button class="btn btn-primary" onclick="testProducts()">Test Products API</button>
                <button class="btn btn-secondary" onclick="testRegister()">Test Register API</button>
                <div id="results" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        function testProducts() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="alert alert-info">Testing Products API...</div>';
            
            fetch('http://localhost:8080/ecommerce-backend/api/products')
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('HTTP ' + response.status);
                })
                .then(data => {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6>✅ Products API Working</h6>
                            <p>Found ${data.length} products</p>
                        </div>
                    `;
                })
                .catch(error => {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Products API Failed</h6>
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        }

        function testRegister() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="alert alert-info">Testing Register API...</div>';
            
            const testData = {
                username: "testuser" + Date.now(),
                email: "test" + Date.now() + "@example.com",
                password: "test123",
                firstName: "Test",
                lastName: "User"
            };
            
            fetch('http://localhost:8080/ecommerce-backend/api/users/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(testData)
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    return response.json();
                } else if (response.status === 409) {
                    throw new Error('User already exists (409)');
                } else if (response.status === 400) {
                    return response.text().then(text => {
                        throw new Error('Bad Request (400): ' + text);
                    });
                } else {
                    return response.text().then(text => {
                        throw new Error('HTTP ' + response.status + ': ' + text);
                    });
                }
            })
            .then(data => {
                resultsDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h6>✅ Register API Working</h6>
                        <p>User created: ${data.firstName} ${data.lastName}</p>
                        <p>Username: ${data.username}</p>
                        <p>Email: ${data.email}</p>
                    </div>
                `;
            })
            .catch(error => {
                console.error('Registration error:', error);
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>❌ Register API Failed</h6>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>Test Data:</strong></p>
                        <pre>${JSON.stringify(testData, null, 2)}</pre>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
